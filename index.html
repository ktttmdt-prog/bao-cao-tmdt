<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Báo cáo TMĐT &amp; Kế hoạch</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F8FAFC;--head:#0F172A;--headink:#FFFFFF;
--sp:#EE4D2D;--sp2:#F7B3A3;--tt:#1E293B;--tt2:#9DB2CE;--ns:#16A34A;--blue:#2563EB;--good:#15803D;--bad:#C2410C;--warn:#B45309;
--violet:#7C3AED;--teal:#0D9488;--amber:#D97706;--gray:#A8B3C2;--sec:#EEF2F7;--tot:#FCEBDD;--okbg:#DCFCE7;--wbg:#FEF3C7;--ebg:#FFE4E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--card:#111827;--ink:#E5E7EB;--mut:#94A3B8;--line:#253043;--soft:#0F172A;--head:#1E293B;
--tt:#CBD5E1;--tt2:#4B5D78;--good:#4ADE80;--bad:#FB923C;--warn:#FBBF24;--sec:#172033;--tot:#2A1D14;--sp2:#8A3423;--gray:#55657C;--okbg:#14301F;--wbg:#3A2E0B;--ebg:#3B1620}}
:root[data-theme="dark"]{--bg:#0B1120;--card:#111827;--ink:#E5E7EB;--mut:#94A3B8;--line:#253043;--soft:#0F172A;--head:#1E293B;
--tt:#CBD5E1;--tt2:#4B5D78;--good:#4ADE80;--bad:#FB923C;--warn:#FBBF24;--sec:#172033;--tot:#2A1D14;--sp2:#8A3423;--gray:#55657C;--okbg:#14301F;--wbg:#3A2E0B;--ebg:#3B1620}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body.locked header,body.locked main,body.locked .foot{display:none}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px}
body:not(.locked) #lock{display:none}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:380px}
.lockbox h1{margin:0 0 4px}.lockbox input{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);margin:14px 0 10px;letter-spacing:2px}
.lockbox button{width:100%;font-size:16px;padding:10px}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1360px;margin:0 auto;padding:10px 16px 4px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:12px}
.ctr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
select,button,input,textarea{font:inherit;color:inherit}
select,.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--sp);color:#fff;border-color:var(--sp)}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--card)}
nav{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{border:0;background:none;padding:9px 11px;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{color:var(--ink);border-bottom-color:var(--sp)}
nav button.pl{color:var(--blue)}nav button.pl.on{border-bottom-color:var(--blue)}
main{max-width:1360px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:16px;margin:0 0 2px}.card h3{font-size:14px;margin:14px 0 6px}
.chead{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.chead>div:first-child{flex:1;min-width:220px}
.note{color:var(--mut);font-size:12px;margin:2px 0 8px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--mut)}.kpi .v{font-size:18px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums;word-break:break-word}.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}.neu{color:var(--mut)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--head);color:var(--headink);font-weight:600;position:sticky;top:0;z-index:2}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:180px;max-width:300px}
th:first-child{background:var(--head);z-index:3}
td small{display:block;color:var(--mut);font-size:11px}
td.pc{color:var(--bad);font-weight:600}
tr.sec td{background:var(--sec);font-weight:700}
tr.tot td{background:var(--tot);font-weight:700}
tr.hd td{font-weight:700;color:var(--mut);background:var(--soft);font-size:11.5px;letter-spacing:.3px;text-transform:uppercase}
td.c-up{color:var(--bad);font-weight:700}td.c-dn{color:var(--good);font-weight:700}
td.tar{color:var(--mut)}td.ytd{font-weight:700}td.l{text-align:left}
td.ok{background:var(--okbg)}td.wn{background:var(--wbg)}td.er{background:var(--ebg)}
.chart{width:100%;height:auto;display:block}
.cw{overflow-x:auto;-webkit-overflow-scrolling:touch}.cw>.chart{min-width:700px}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .zero{stroke:var(--mut);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px}.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.chart .halo{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.lg i.ln{height:3px;border-radius:2px;vertical-align:3px}
ul.ins{margin:6px 0 0;padding-left:18px}ul.ins li{margin:5px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px}
.tag.e{background:var(--ebg);color:var(--bad)}.tag.w{background:var(--wbg);color:var(--warn)}.tag.i{background:var(--sec);color:var(--mut)}.tag.k{background:var(--okbg);color:var(--good)}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sim label{font-size:12px;color:var(--mut);display:block}
.sim input,.fi{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);text-align:right}
.ed{width:132px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--soft);text-align:right}
.ed.t{text-align:left;width:220px}.ed.s{width:70px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
body.embed .btn[data-xls],body.embed [data-png],body.embed #bXls,body.embed #bPrint,body.embed #bSave,body.embed #dExp,body.embed #dPw,body.embed #dDel{display:none!important}
body.viewer #bSave,body.viewer #dPw,body.viewer #pwBox,body.viewer #dDel,body.viewer #dAdd,body.viewer #dExp,body.viewer #vwBox{display:none!important}
.foot{color:var(--mut);font-size:12px;text-align:center;padding:10px 0 30px}
@media (max-width:640px){header{position:static}h1{font-size:16px}main{padding:10px}.card{padding:12px}td:first-child,th:first-child{min-width:140px}.kpi .v{font-size:16px}}
@media print{header .ctr,nav,.noprint,.btn{display:none!important}header{position:static}.panel{display:block!important;break-before:page}
 .card{break-inside:avoid;border:0;padding:6px 0}body,html{background:#fff}th,td:first-child,th:first-child{position:static}
 .tw{overflow:visible;max-height:none;border:0}table{font-size:9px}th,td{padding:2px 3px}.cw>.chart{min-width:0}}
</style>
</head>

<div id="lock"><div class="lockbox">

/* ===================== MÃ HÓA (SHA-256, HMAC, PBKDF2, AES-256-CBC) – chạy được cả khi không có Web Crypto ===================== */
const Sec=(()=>{
 const pr=[];for(let p=2;pr.length<64;p++){if(pr.every(q=>q*q>p||p%q))pr.push(p);}
 const K=new Int32Array(64),H0=new Int32Array(8);
 for(let i=0;i<64;i++)K[i]=Math.floor((Math.cbrt(pr[i])%1)*4294967296);

 function comp(H,W){
  for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];
   const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0;}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])|0;
   const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}

 function hash(bytes,Hs,pre){const H=Int32Array.from(Hs||H0),len=bytes.length,total=(pre||0)+len,nb=(len+9+63)>>6,buf=new Uint8Array(nb*64);buf.set(bytes);buf[len]=0x80;

 const F=["orders","nmv","gv",...LINES,"dinh","bien","phisan","phisan_net","bhk","vhbd","kho","vhcd_o","tnk","cpk","lng","ld","kq","opx","kqv"];
 ["sp","tt","ns","all"].forEach(c=>{C[c]={};F.forEach(f=>C[c][f]=new Array(n).fill(0));});
 const totLine=(k,i)=>k==="hh"?g(T,"hh",i)+g(T,"aff1",i)+g(T,"aff2",i)+g(T,"aff3",i):k==="ship"?g(T,"ship",i)+g(T,"bt",i)+g(T,"bh",i)+g(T,"gtr",i):g(T,k,i);
 for(let i=0;i<n;i++){
  const v={sp:{},tt:{},ns:{}};
  for(const c of["sp","tt"]){v[c].orders=g(D[c],"orders",i);v[c].nmv=g(D[c],"nmv",i);LINES.forEach(k=>v[c][k]=g(D[c],k,i));}
  v.ns.orders=g(T,"don_tc",i)-v.sp.orders-v.tt.orders;v.ns.nmv=g(T,"nmv",i)-v.sp.nmv-v.tt.nmv;
  for(const k of LINES){if(k==="thue"){v.ns.thue=0;continue;}
   const tot=k==="vatcty"?g(T,"gtgt",i)+g(T,"tncn",i)-v.sp.thue-v.tt.thue:totLine(k,i);let r=tot-v.sp[k]-v.tt[k];
   if(Math.abs(r)<2&&(v.tt.nmv||v.sp.nmv)){if(k==="vatcty")v.tt.thue+=r;else v.tt[k]+=r;r=0;}v.ns[k]=r;}
  const N=g(T,"nmv",i),Q=g(T,"don_tc",i),bhkT=g(T,"the_cao",i)+g(T,"booking",i)+g(T,"mkt",i)+g(T,"qua",i)+g(T,"hoantien",i),khoT=g(T,"luong_vd",i),vhcdO=g(T,"vhcd",i)-khoT;
  for(const c of["sp","tt","ns"]){const o=v[c],sN=N?o.nmv/N:0,sQ=Q?o.orders/Q:sN;
   o.gv=gvEff(T,i)*sN;o.bhk=bhkT*sN;o.vhbd=g(T,"vhbd",i)*sN;o.kho=khoT*sQ;o.vhcd_o=vhcdO*sN;o.tnk=g(T,"tnk",i)*sN;o.cpk=g(T,"cpk",i)*sN;
   o.dinh=o.tt+o.cd+o.sfp+o.vc+o.ht+o.ps+o.thue+o.vatcty;o.bien=o.hh+o.gcd+o.ship;o.phisan=o.dinh+o.bien;o.phisan_net=o.phisan-o.vatcty;
   o.lng=o.nmv-o.gv-o.phisan;o.ld=o.lng-o.ads-o.bhk;o.opx=o.vhbd+o.kho+o.vhcd_o+o.cpk-o.tnk;o.kq=o.ld-o.opx;o.kqv=o.kq+o.vatcty;
   F.forEach(f=>{C[c][f][i]=o[f];C.all[f][i]+=o[f];});}
 }
 const A=C.all;["gmv","ds_huy","ds_xk","ds_hoan","don_dat","don_hh","tndn","lnr","kqkd"].forEach(k=>A[k]=Array.from({length:n},(_,i)=>g(T,k,i)));
 return{n,months:D.months,status:D.status,ch:C};
}

function nice(min,max,ticks=4){if(!isFinite(min)||!isFinite(max)){min=0;max=1;}if(max-min<1e-9){max=min+(Math.abs(min)||1);}const st0=(max-min)/ticks,mag=Math.pow(10,Math.floor(Math.log10(st0))),r=st0/mag;
 const st=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag,lo=Math.floor(min/st+1e-9)*st,hi=Math.ceil(max/st-1e-9)*st,t=[];for(let x=lo;x<=hi+st/2;x+=st)t.push(+x.toFixed(6));return{lo,hi,t};}

function combo(o){

 const n=o.labels.length,pw=W-ml-mr,ph=H-mt-mb,bw=pw/n,bars=o.bars||[],lines=o.lines||[];
 let lmin=0,lmax=0;
 if(o.stacked){for(let i=0;i<n;i++){let p=0,q=0;bars.forEach(b=>{const v=b.values[i]||0;v>=0?p+=v:q+=v;});lmax=Math.max(lmax,p);lmin=Math.min(lmin,q);}}
 else bars.forEach(b=>b.values.forEach(v=>{lmax=Math.max(lmax,v||0);lmin=Math.min(lmin,v||0);}));
 lines.filter(l=>!l.right).forEach(l=>l.values.forEach(v=>{if(v!=null&&isFinite(v)){lmax=Math.max(lmax,v);lmin=Math.min(lmin,v);}}));
 const L=nice(lmin,lmax+(lmax-lmin)*0.08),rv=[];lines.filter(l=>l.right).forEach(l=>l.values.forEach(v=>{if(v!=null&&isFinite(v))rv.push(v);}));
 let R=null;if(rv.length){const a=Math.min(...rv),b=Math.max(...rv),pad=(b-a)*0.12||Math.abs(b)*0.1||1;R=nice(o.rZero?Math.min(0,a):a-pad,b+pad);}
 const yL=v=>mt+ph-(v-L.lo)/(L.hi-L.lo)*ph,yR=v=>mt+ph-(v-R.lo)/(R.hi-R.lo)*ph,yf=o.yFmt||fn0,rf=o.rFmt||fn0;

 L.t.forEach(v=>{s+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${yL(v)}" y2="${yL(v)}"/><text class="ax" x="${ml-6}" y="${yL(v)+4}" text-anchor="end">${yf(v)}</text>`;});

  bars.forEach((b,j)=>{const v=b.values[i]||0;let y1,y2,x;
   if(o.stacked){x=x0;if(v>=0){y1=yL(pp+v);y2=yL(pp);pp+=v;}else{y1=yL(qq);y2=yL(qq+v);qq+=v;}}else{x=x0+j*bwid;y1=yL(Math.max(v,0));y2=yL(Math.min(v,0));}
   s+=`<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(1,bwid-1.5).toFixed(1)}" height="${Math.max(0,y2-y1).toFixed(1)}" rx="2" style="fill:${b.color}${o.bo?";fill-opacity:"+o.bo:""}"><title>${esc(o.labels[i]+" · "+b.name+": "+(b.tip||yf)(v))}</title></rect>`;

 if(L.lo<0)s+=`<line class="zero" x1="${ml}" x2="${W-mr}" y1="${yL(0)}" y2="${yL(0)}"/>`;
 lines.forEach(l=>{const y=l.right?yR:yL,lf=l.fmt||(l.right?rf:yf);let d="",pts="";
  l.values.forEach((v,i)=>{if(v==null||!isFinite(v))return;const x=ml+i*bw+bw/2,yy=y(v);d+=(d?"L":"M")+x.toFixed(1)+" "+yy.toFixed(1);

 let mn=0,mx=0;sg.forEach(s=>{mn=Math.min(mn,s.a,s.b);mx=Math.max(mx,s.a,s.b);});
 const X=nice(mn,mx,4),x=v=>lab+(v-X.lo)/(X.hi-X.lo)*pw,f=o.fmt||D0;

function seriesTable(o){
 const n=o.labels.length,ncol=1+(o.tar?1:0)+n+(o.ytd?1:0)+(o.extra?o.extra.length:0);
 let h=`<div class="tbox">${xlsBtn()}<div class="tw"><table data-title="${esc(o.title)}"><thead><tr><th>${esc(o.first||"Khoản mục")}</th>${o.tar?"<th>Biểu phí</th>":""}${o.labels.map((l,i)=>`<th>${esc(l)}${o.hl===i?" ◆":""}</th>`).join("")}${o.ytd?`<th>${esc(o.ytdLabel||"Lũy kế")}</th>`:""}${(o.extra||[]).map(e=>`<th>${esc(e.h)}</th>`).join("")}</tr></thead><tbody>`;
 for(const r of o.rows){
  if(r.h){h+=`<tr class="hd"><td colspan="${ncol}">${esc(r.h)}</td></tr>`;continue;}
  const k=kindOf(r,o);h+=`<tr class="${r.cls||""}"><td>${esc(r.l)}</td>`;if(o.tar)h+=`<td class="tar">${esc(r.tar||"")}</td>`;let prev=null;
  for(let i=0;i<n;i++){const v=rowVal(r,i,o);let c="";
   if(r.chg&&prev!=null&&v!=null){const thr=r.thr!=null?r.thr:(k==="rate"?0.005:k==="dong"?150:Infinity),d=v-prev;if(Math.abs(d)>thr)c=((d>0)===(r.good!=="up"))?"c-up":"c-dn";}
   h+=`<td class="${c}" ${cellData(v,k)}>${fmtK(v,k,r.d)}</td>`;prev=v;}
  if(o.ytd){if(r.noYtd)h+="<td></td>";else{const v=rowYtd(r,o,n);h+=`<td class="ytd" ${cellData(v,k)}>${fmtK(v,k,r.d)}</td>`;}}
  (o.extra||[]).forEach(e=>{const x=e.f(r);if(!x){h+="<td></td>";return;}h+=`<td class="${x.c||""}" ${cellData(x.v,x.t||k)}>${x.txt!=null?x.txt:fmtK(x.v,x.t||k,x.d)}</td>`;});
  h+="</tr>";}
 return h+`</tbody></table></div>${o.foot?`<div class="note">${o.foot}</div>`:""}</div>`;
}
function simpleTable(title,head,rows,foot){
 let h=`<div class="tbox">${xlsBtn()}<div class="tw"><table data-title="${esc(title)}"><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{if(r.h){h+=`<tr class="hd"><td colspan="${head.length}">${esc(r.h)}</td></tr>`;return;}
  h+=`<tr class="${r.cls||""}">`+r.cells.map(c=>{if(typeof c!=="object"||c===null)return`<td>${esc(c==null?"":c)}</td>`;
   const t=c.t||"amt",txt=c.txt!=null?c.txt:fmtK(c.v,t,c.d);return`<td class="${c.c||""}" ${c.v!=null?cellData(c.v,t):""} ${c.bar!=null?`style="${cellBar(c.bar,c.barC)}"`:""}>${txt}${c.s?`<small>${c.s}</small>`:""}</td>`;}).join("")+"</tr>";});
 return h+`</tbody></table></div>${foot?`<div class="note">${foot}</div>`:""}</div>`;
}

function sliceData(D,a,b){const o=Object.assign({},D),sl=x=>Array.isArray(x)?x.slice(a,b+1):x,rk=src=>{const r={};Object.keys(src||{}).forEach(k=>{const i=+k;if(i>=a&&i<=b)r[String(i-a)]=src[k];});return r;};
 o.months=D.months.slice(a,b+1);o.status=(D.status||[]).slice(a,b+1);["tot","sp","tt"].forEach(s=>{o[s]={};Object.keys(D[s]||{}).forEach(k=>o[s][k]=sl(D[s][k]));});
 o.settle=rk(D.settle);o.shops=rk(D.shops);if(D.recon&&D.recon.kq_ct)o.recon=Object.assign({},D.recon,{kq_ct:D.recon.kq_ct.slice(a,b+1)});return o;}

function aggModel(F,rs){const ch={};Object.keys(F.ch).forEach(c=>{ch[c]={};Object.keys(F.ch[c]).forEach(k=>{const arr=F.ch[c][k];ch[c][k]=rs.map(r=>r?sum(arr.slice(r[0],r[1]+1)):0);});});
 return{n:rs.length,months:rs.map(r=>r?perLab(r[0],r[1]):"–"),status:rs.map(()=>""),ch};}
function fixPeriod(n){const pm=S.pm||"m";S.m=Math.max(0,Math.min(n-1,S.m|0));
 if(pm==="m")S.a=S.m;else if(pm==="ytd")S.a=0;else if(pm==="y"){S.a=0;S.m=n-1;}
 else if(pm==="q"){const q=Math.floor(S.m/3);S.a=3*q;S.m=Math.min(3*q+2,n-1);}
 else S.a=Math.max(0,Math.min(S.a==null?S.m:S.a|0,S.m));}
function setPeriod(){fixPeriod(MF.n);const a=S.a,b=S.m,len=b-a+1,prev=a-len>=0?[a-len,a-1]:null,single=a===b;

 PV={X,i:1,p:prev?0:-1,a,b,len,single,off:single?0:a,lab:X.months[1],plab:prev?X.months[0]:"",hl:single?a:-1,ytdL:single?"Lũy kế":"Cộng "+X.months[1]};}

   if(ch.length)t+=`; biến động lớn: ${ch.map(x=>`${CH_LBL[x[0]].toLowerCase()} ${fpt(x[1])}`).join(", ")}`;}

 const sp=X.ch.sp,tt=X.ch.tt;if(sp.nmv[m]&&tt.nmv[m])out.push(`Mỗi 100đ doanh số, Shopee trả cho sàn và thuế nhiều hơn TikTok <b>${fn1((sp.phisan[m]/sp.nmv[m]-tt.phisan[m]/tt.nmv[m])*100)}đ</b>; KQKD sau phân bổ: Shopee ${VD(sp.kq[m])} (${fpct(sp.kq[m]/sp.nmv[m],1)}), TikTok ${VD(tt.kq[m])} (${fpct(tt.kq[m]/tt.nmv[m],1)}); trước thuế GTGT công ty: Shopee ${VD(sp.kqv[m])} (${fpct(sp.kqv[m]/sp.nmv[m],1)}), TikTok ${VD(tt.kqv[m])} (${fpct(tt.kqv[m]/tt.nmv[m],1)}).`);

 const Q=A.orders[m];if(Q){let t=`Chi phí kho vận ${fn0(A.kho[m]/Q*1e6)} đ/đơn thành công (${fpct(A.kho[m]/N,2)} doanh số)`;if(p>=0&&A.orders[p])t+=`, ${mo[p]}: ${fn0(A.kho[p]/A.orders[p]*1e6)} đ`;out.push(t+".");}
 const yN=ytd(FA.nmv,b),yK=ytd(FA.kq,b),rem=12-(b+1);let t=`<b>Lũy kế ${FM[0]}–${FM[b]}</b>: KQKD ${VD(yK)}, biên ${fpct(yK/yN,2)}.`;

 out.push(t);const st=PV.single&&D.settle&&D.settle[String(PV.a)];if(st)out.push(`Còn <b>${VD(st.ds_cho)} doanh số chờ sàn quyết toán</b>, phí tạm tính ${VD(st.phi_tt)} → khoảng ${VD(st.ds_cho-st.phi_tt)} chưa về tài khoản.`);

const LEV=[["gv","Giá vốn (điểm %)","Ban điều hành / thu mua","pt"],["ads","ADS mọi kênh (điểm %)","Phòng Kinh doanh","pt"],["bhk","Booking, marketing, quà tặng (điểm %)","Booking / Marketing","pt"],["aov","Giá trị đơn bình quân – combo (±%)","Phòng Kinh doanh","pct"],["prod","Năng suất kho (+%)","Phòng Vận hành","pct"],["staff","Định biên bộ máy (±%)","Hành chính – Nhân sự","pct"],["office","Chi phí văn phòng, phúc lợi (±%)","Hành chính – Nhân sự","pct"]];
function applyLev(P,only){const L=P.levers||{},on=k=>!only||only.includes(k),v=k=>on(k)?(+L[k]||0):0;
 P.gvRate+=v("gv");["sp","tt","ns"].forEach(c=>{P.ads[c]=Math.max(0,P.ads[c]+v("ads"));P.aov[c]*=1+v("aov");});{const sb=sum(Object.values(P.bh||{}));if(sb>0&&v("bhk")){const fx=Math.max(0,sb+v("bhk"))/sb;Object.keys(P.bh).forEach(k=>P.bh[k]*=fx);}}
 P.kho.prod*=1+v("prod");(P.staff||[]).forEach(s=>{if(!s.auto)s.n*=1+v("staff");});(P.office||[]).forEach(o=>{o.m=o.m.map(x=>x*(1+v("office")));});}
function planCalc(P0,ov,lev){
 const P=JSON.parse(JSON.stringify(P0));if(lev)applyLev(P,lev===true?null:lev);if(ov)ov(P);
 const chs=["sp","tt","ns"],ms=sum(chs.map(c=>P.mix[c]||0))||1,sw=sum(P.season)||1,K=P.kho,bhR=sum(Object.values(P.bh||{}));
 const R={P,gmv:[],nmv:[],orders:[],dondat:[],gv:[],fee:[],tax:[],ads:[],bhk:[],lbm:[],lkho:[],tv:[],tvCong:[],fct:[],fctVat:[],ins:[],l13:[],kpi:[],rent:[],office:[],tnk:[],pre:[],bonus:[],kq:[],cit:[],lnr:[],ch:{}};
 chs.forEach(c=>{R.ch[c]={gmv:[],nmv:[],orders:[],fee:[],tax:[],ads:[]};});
 const NY=P.nmv!=null?P.nmv:P.gmv*P.nmvRate;
 for(let m=0;m<12;m++){const N=NY*(P.season[m]||0)/sw,gm=P.nmvRate?N/P.nmvRate:0;let Q=0,fee=0,tax=0,ads=0;
  chs.forEach(c=>{const s=(P.mix[c]||0)/ms,Nc=N*s,Qc=P.aov[c]?Nc/P.aov[c]:0,o=R.ch[c];o.gmv[m]=gm*s;o.nmv[m]=Nc;o.orders[m]=Qc;o.fee[m]=Nc*(P.fee[c]+((P.feeUp||{})[c]||0));o.tax[m]=Nc*P.tax[c];o.ads[m]=Nc*P.ads[c];Q+=Qc;fee+=o.fee[m];tax+=o.tax[m];ads+=o.ads[m];});
  R.gmv[m]=gm;R.nmv[m]=N;R.orders[m]=Q;R.dondat[m]=Q/(1-P.cancelRate);R.gv[m]=N*P.gvRate;R.fee[m]=fee;R.tax[m]=tax;R.ads[m]=ads;R.bhk[m]=N*bhR;
  const F=P.fct||{},base=F.on===false?0:(R.ch.tt.fee[m]+R.ch.tt.ads[m]+R.ch.ns.ads[m]),dt=base/(1-(F.gtgt||0)-(F.tndn||0));R.fct[m]=dt*(F.tndn||0);R.fctVat[m]=dt*(F.gtgt||0);}
 const so=[...R.orders].sort((a,b)=>a-b),med=(so[5]+so[6])/2;R.nKho=K.prod&&K.days?Math.ceil(med/(K.prod*K.days)):0;
 R.staffRows=(P.staff||[]).map(s=>({...s,n:s.auto?R.nKho:(+s.n||0)}));
 for(let m=0;m<12;m++){let lbm=0,lkho=0;R.staffRows.forEach(s=>{if(m+1>=(s.from||1)){const x=s.n*s.sal;if(s.auto)lkho+=x;else lbm+=x;}});
  const cap=R.nKho*K.prod*K.days,over=Math.max(0,R.orders[m]-cap),cong=K.prod?over/(K.prod*K.tvEff):0;
  R.lbm[m]=lbm;R.lkho[m]=lkho;R.tvCong[m]=cong;R.tv[m]=cong*K.tvDay;R.ins[m]=(lbm+lkho)*P.insBase*P.insRate;R.l13[m]=(lbm+lkho)*P.thang13/12;R.kpi[m]=R.nmv[m]*P.kpiRate;
  R.rent[m]=K.rent+K.svc;R.office[m]=sum((P.office||[]).map(o=>+o.m[m]||0));R.tnk[m]=P.otherIncome;
  R.pre[m]=R.nmv[m]-R.gv[m]-R.fee[m]-R.tax[m]-R.fct[m]-R.ads[m]-R.bhk[m]-lbm-lkho-R.tv[m]-R.ins[m]-R.l13[m]-R.kpi[m]-R.rent[m]-R.office[m]+R.tnk[m];}
 const bonus=Math.max(0,sum(R.pre)-P.target*sum(R.nmv))*P.bonusShare;
 for(let m=0;m<12;m++){R.bonus[m]=m===11?bonus:0;R.kq[m]=R.pre[m]-R.bonus[m];}
 const yk=sum(R.kq);for(let m=0;m<12;m++){R.cit[m]=yk>0?R.kq[m]*P.citRate:0;R.lnr[m]=R.kq[m]-R.cit[m];}
 R.payroll=m=>R.lbm[m]+R.lkho[m]+R.tv[m]+R.ins[m]+R.l13[m]+R.kpi[m]+R.bonus[m];
 return R;}
function solveNmv(P,margin,lev){const f=x=>{const R=planCalc(P,q=>{q.nmv=x;},lev);const N=sum(R.nmv);return N?sum(R.kq)/N-margin:-1;};
