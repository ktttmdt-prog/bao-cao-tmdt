<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Báo cáo TMĐT &amp; Kế hoạch</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#F4F6F9;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--soft:#F8FAFC;--head:#0F172A;--headink:#FFFFFF;
--sp:#EE4D2D;--sp2:#F7B3A3;--tt:#1E293B;--tt2:#9DB2CE;--ns:#16A34A;--blue:#2563EB;--good:#15803D;--bad:#C2410C;--warn:#B45309;
--violet:#7C3AED;--teal:#0D9488;--amber:#D97706;--gray:#A8B3C2;--sec:#EEF2F7;--tot:#FCEBDD;--okbg:#DCFCE7;--wbg:#FEF3C7;--ebg:#FFE4E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--card:#111827;--ink:#E5E7EB;--mut:#94A3B8;--line:#253043;--soft:#0F172A;--head:#1E293B;
--tt:#CBD5E1;--tt2:#4B5D78;--good:#4ADE80;--bad:#FB923C;--warn:#FBBF24;--sec:#172033;--tot:#2A1D14;--sp2:#8A3423;--gray:#55657C;--okbg:#14301F;--wbg:#3A2E0B;--ebg:#3B1620}}
:root[data-theme="dark"]{--bg:#0B1120;--card:#111827;--ink:#E5E7EB;--mut:#94A3B8;--line:#253043;--soft:#0F172A;--head:#1E293B;
--tt:#CBD5E1;--tt2:#4B5D78;--good:#4ADE80;--bad:#FB923C;--warn:#FBBF24;--sec:#172033;--tot:#2A1D14;--sp2:#8A3423;--gray:#55657C;--okbg:#14301F;--wbg:#3A2E0B;--ebg:#3B1620}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body.locked header,body.locked main,body.locked .foot{display:none}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;padding:16px}
body:not(.locked) #lock{display:none}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:380px}
.lockbox h1{margin:0 0 4px}.lockbox input{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);margin:14px 0 10px;letter-spacing:2px}
.lockbox button{width:100%;font-size:16px;padding:10px}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.hwrap{max-width:1360px;margin:0 auto;padding:10px 16px 4px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.sub{color:var(--mut);font-size:12px}
.ctr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
select,button,input,textarea{font:inherit;color:inherit}
select,.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--sp);color:#fff;border-color:var(--sp)}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--card)}
nav{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{border:0;background:none;padding:9px 11px;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{color:var(--ink);border-bottom-color:var(--sp)}
nav button.pl{color:var(--blue)}nav button.pl.on{border-bottom-color:var(--blue)}
main{max-width:1360px;margin:0 auto;padding:16px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:16px;margin:0 0 2px}.card h3{font-size:14px;margin:14px 0 6px}
.chead{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.chead>div:first-child{flex:1;min-width:220px}
.note{color:var(--mut);font-size:12px;margin:2px 0 8px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--mut)}.kpi .v{font-size:18px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums;word-break:break-word}.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}.neu{color:var(--mut)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;max-height:78vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--head);color:var(--headink);font-weight:600;position:sticky;top:0;z-index:2}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;min-width:180px;max-width:300px}
th:first-child{background:var(--head);z-index:3}
td small{display:block;color:var(--mut);font-size:11px}
td.pc{color:var(--bad);font-weight:600}
tr.sec td{background:var(--sec);font-weight:700}
tr.tot td{background:var(--tot);font-weight:700}
tr.hd td{font-weight:700;color:var(--mut);background:var(--soft);font-size:11.5px;letter-spacing:.3px;text-transform:uppercase}
td.c-up{color:var(--bad);font-weight:700}td.c-dn{color:var(--good);font-weight:700}
td.tar{color:var(--mut)}td.ytd{font-weight:700}td.l{text-align:left}
td.ok{background:var(--okbg)}td.wn{background:var(--wbg)}td.er{background:var(--ebg)}
.chart{width:100%;height:auto;display:block}
.cw{overflow-x:auto;-webkit-overflow-scrolling:touch}.cw>.chart{min-width:700px}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .zero{stroke:var(--mut);stroke-width:1}
.chart .ax{fill:var(--mut);font-size:11px}.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.chart .halo{paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.lg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:6px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.lg i.ln{height:3px;border-radius:2px;vertical-align:3px}
ul.ins{margin:6px 0 0;padding-left:18px}ul.ins li{margin:5px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px}
.tag.e{background:var(--ebg);color:var(--bad)}.tag.w{background:var(--wbg);color:var(--warn)}.tag.i{background:var(--sec);color:var(--mut)}.tag.k{background:var(--okbg);color:var(--good)}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sim label{font-size:12px;color:var(--mut);display:block}
.sim input,.fi{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);text-align:right}
.ed{width:132px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--soft);text-align:right}
.ed.t{text-align:left;width:220px}.ed.s{width:70px}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
body.embed .btn[data-xls],body.embed [data-png],body.embed #bXls,body.embed #bPrint,body.embed #bSave,body.embed #dExp,body.embed #dPw,body.embed #dDel{display:none!important}
body.viewer #bSave,body.viewer #dPw,body.viewer #pwBox,body.viewer #dDel,body.viewer #dAdd,body.viewer #dExp,body.viewer #vwBox{display:none!important}
.foot{color:var(--mut);font-size:12px;text-align:center;padding:10px 0 30px}
@media (max-width:640px){header{position:static}h1{font-size:16px}main{padding:10px}.card{padding:12px}td:first-child,th:first-child{min-width:140px}.kpi .v{font-size:16px}}
@media print{header .ctr,nav,.noprint,.btn{display:none!important}header{position:static}.panel{display:block!important;break-before:page}
 .card{break-inside:avoid;border:0;padding:6px 0}body,html{background:#fff}th,td:first-child,th:first-child{position:static}
 .tw{overflow:visible;max-height:none;border:0}table{font-size:9px}th,td{padding:2px 3px}.cw>.chart{min-width:0}}
</style>
</head>
<body class="locked">
<div id="lock"><div class="lockbox">
 <h1>Báo cáo TMĐT</h1><div class="sub">Dữ liệu trong file đã được mã hóa. Nhập mã bảo mật để xem.</div>

<header>
 <div class="hwrap">
  <div><h1>Báo cáo TMĐT &amp; Kế hoạch</h1><div class="sub" id="subt"></div></div>

/* kind: amt (triệu → đồng) | vnd (đồng) | cnt | dong (đồng/đơn) | rate | x */
function rowVal(r,i,o){if(r.num)return dv(r.num(i),r.den(i));const v=r.f(i);if(o.mode==="pct"&&(r.kind||"amt")==="amt"&&!r.isBase)return dv(v,o.base(i));return v;}
function rowYtd(r,o,n){const idx=[...Array(n).keys()];if(r.num)return dv(sum(idx.map(r.num)),sum(idx.map(r.den)));const v=sum(idx.map(r.f));if(o.mode==="pct"&&(r.kind||"amt")==="amt"&&!r.isBase)return dv(v,sum(idx.map(o.base)));return v;}
function kindOf(r,o){if(r.num)return r.kind||"rate";const k=r.kind||o.kind||"amt";if(o.mode==="pct"&&k==="amt"&&!r.isBase)return"rate";return k;}
function fmtK(v,k,d){if(v==null||!isFinite(v))return"–";if(k==="rate")return fpct(v,d==null?2:d);if(k==="cnt")return fn0(v);if(k==="dong")return fn0(v)+"đ";if(k==="x")return fn2(v)+"x";if(k==="vnd")return D0(v);if(k==="num")return fn(v,d==null?1:d);return V(v);}
function cellData(v,k){if(v==null||!isFinite(v))return"";const x=k==="amt"?Math.round(v*1e6):v;return`data-v="${x}" data-t="${k}"`;}
function xlsBtn(){return`<div class="row noprint" style="margin:0 0 6px;justify-content:flex-end"><button class="btn sm" data-xls>Excel bảng này</button></div>`;}
function seriesTable(o){
 const n=o.labels.length,ncol=1+(o.tar?1:0)+n+(o.ytd?1:0)+(o.extra?o.extra.length:0);
 let h=`<div class="tbox">${xlsBtn()}<div class="tw"><table data-title="${esc(o.title)}"><thead><tr><th>${esc(o.first||"Khoản mục")}</th>${o.tar?"<th>Biểu phí</th>":""}${o.labels.map((l,i)=>`<th>${esc(l)}${o.hl===i?" ◆":""}</th>`).join("")}${o.ytd?`<th>${esc(o.ytdLabel||"Lũy kế")}</th>`:""}${(o.extra||[]).map(e=>`<th>${esc(e.h)}</th>`).join("")}</tr></thead><tbody>`;
 for(const r of o.rows){
  if(r.h){h+=`<tr class="hd"><td colspan="${ncol}">${esc(r.h)}</td></tr>`;continue;}
  const k=kindOf(r,o);h+=`<tr class="${r.cls||""}"><td>${esc(r.l)}</td>`;if(o.tar)h+=`<td class="tar">${esc(r.tar||"")}</td>`;let prev=null;
  for(let i=0;i<n;i++){const v=rowVal(r,i,o);let c="";
   if(r.chg&&prev!=null&&v!=null){const thr=r.thr!=null?r.thr:(k==="rate"?0.005:k==="dong"?150:Infinity),d=v-prev;if(Math.abs(d)>thr)c=((d>0)===(r.good!=="up"))?"c-up":"c-dn";}
   h+=`<td class="${c}" ${cellData(v,k)}>${fmtK(v,k,r.d)}</td>`;prev=v;}
  if(o.ytd){if(r.noYtd)h+="<td></td>";else{const v=rowYtd(r,o,n);h+=`<td class="ytd" ${cellData(v,k)}>${fmtK(v,k,r.d)}</td>`;}}
  (o.extra||[]).forEach(e=>{const x=e.f(r);if(!x){h+="<td></td>";return;}h+=`<td class="${x.c||""}" ${cellData(x.v,x.t||k)}>${x.txt!=null?x.txt:fmtK(x.v,x.t||k,x.d)}</td>`;});
  h+="</tr>";}

function simpleTable(title,head,rows,foot){

/* ===================== 1. TỔNG QUAN ===================== */
function hundred(c,i){const C=M.ch[c],N=C.nmv[i];if(!N)return null;const q=x=>x/N*100;
 const parts=[{n:"Giá vốn",v:q(C.gv[i]),c:"var(--gray)"},{n:"Phí sàn (sàn cấn trừ)",v:q(C.phisan_net[i]),c:"var(--sp)"},{n:"Thuế GTGT công ty",v:q(C.vatcty[i]),c:"var(--amber)"},{n:"ADS",v:q(C.ads[i]),c:"var(--violet)"},{n:"CP bán hàng khác",v:q(C.bhk[i]),c:"var(--teal)"},{n:"Vận hành, lương, kho (trừ TN khác)",v:q(C.opx[i]),c:"var(--tt2)"},{n:"KQKD (lãi)",v:Math.max(0,q(C.kq[i])),c:"var(--blue)"}];
 return{label:CHN[c],parts,loss:C.kq[i]<0?-q(C.kq[i]):0};}
function insights(m){
 const A=M.ch.all,p=m-1,out=[],mo=M.months,N=A.nmv[m],kq=A.kq[m],mg=kq/N;
 if(p>=0&&A.nmv[p]){const dN=N/A.nmv[p]-1,dQ=A.orders[m]/A.orders[p]-1,aov=N/A.orders[m]*1e6,aovp=A.nmv[p]/A.orders[p]*1e6;
  out.push(`<b>Doanh số sau hoàn ${VD(N)}</b>, ${dN>=0?"tăng":"giảm"} ${fn1(Math.abs(dN)*100)}% so ${mo[p]}: số đơn ${fsg(dQ*100)}%, giá trị đơn bình quân ${fsg((aov/aovp-1)*100)}% (${fn0(aov)} đ/đơn).`);}
 out.push(`<b>KQKD ${VD(kq)}, biên ${fpct(mg,1)}</b> – ${mg>=TARGET?`<span class="up">đạt</span> mục tiêu 8%`:`<span class="dn">thiếu ${VD(TARGET*N-kq)}</span> để đạt biên 8%`}.${p>=0&&A.nmv[p]?` ${mo[p]}: ${fpct(A.kq[p]/A.nmv[p],1)}.`:""}`);
 ["sp","tt"].forEach(c=>{const C=M.ch[c];if(!C.nmv[m])return;const r=C.phisan[m]/C.nmv[m];let t=`<b>${CHN[c]}</b>: phí sàn ${fpct(r,1)} doanh số`;
  if(p>=0&&C.nmv[p]){t+=` (${fpt(r-C.phisan[p]/C.nmv[p])} điểm)`;const ch=LINES.filter(k=>k!=="ads").map(k=>[k,C[k][m]/C.nmv[m]-C[k][p]/C.nmv[p]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2).filter(x=>Math.abs(x[1])>=0.002);
   if(ch.length)t+=`; biến động lớn: ${ch.map(x=>`${CH_LBL[x[0]].toLowerCase()} ${fpt(x[1])}`).join(", ")}`;}
  t+=`; ADS ${fpct(C.ads[m]/C.nmv[m],1)} (ROAS ${fn1(C.nmv[m]/C.ads[m])}x); lãi đóng góp ${fpct(C.ld[m]/C.nmv[m],1)}.`;out.push(t);});
 const sp=M.ch.sp,tt=M.ch.tt;if(sp.nmv[m]&&tt.nmv[m])out.push(`Mỗi 100đ doanh số, Shopee trả cho sàn và thuế nhiều hơn TikTok <b>${fn1((sp.phisan[m]/sp.nmv[m]-tt.phisan[m]/tt.nmv[m])*100)}đ</b>; KQKD sau phân bổ: Shopee ${VD(sp.kq[m])} (${fpct(sp.kq[m]/sp.nmv[m],1)}), TikTok ${VD(tt.kq[m])} (${fpct(tt.kq[m]/tt.nmv[m],1)}); trước thuế GTGT công ty: Shopee ${VD(sp.kqv[m])} (${fpct(sp.kqv[m]/sp.nmv[m],1)}), TikTok ${VD(tt.kqv[m])} (${fpct(tt.kqv[m]/tt.nmv[m],1)}).`);
 if(sp.vatcty[m]>0)out.push(`Thuế GTGT công ty phải nộp cho Shopee <b>${VD(sp.vatcty[m])} = ${fpct(sp.vatcty[m]/sp.nmv[m],1)}</b> doanh số Shopee, cao hơn mức 1,5% sàn khấu trừ trước đây.`);
 const Q=g(D.tot,"don_tc",m);if(Q){let t=`Chi phí kho vận ${fn0(g(D.tot,"luong_vd",m)/Q*1e6)} đ/đơn thành công (${fpct(g(D.tot,"luong_vd",m)/N,2)} doanh số)`;if(p>=0&&g(D.tot,"don_tc",p))t+=`, ${mo[p]}: ${fn0(g(D.tot,"luong_vd",p)/g(D.tot,"don_tc",p)*1e6)} đ`;out.push(t+".");}
 const yN=ytd(A.nmv,m),yK=ytd(A.kq,m),rem=12-(m+1);let t=`<b>Lũy kế ${mo[0]}–${mo[m]}</b>: KQKD ${VD(yK)}, biên ${fpct(yK/yN,2)}.`;
 if(rem>0&&m>=2){const avg=(A.nmv[m]+A.nmv[m-1]+A.nmv[m-2])/3,need=TARGET*(yN+avg*rem)-yK;t+=` Nếu ${rem} tháng còn lại giữ doanh số bình quân 3 tháng gần nhất (${VD(avg)}/tháng), mỗi tháng cần lãi ${VD(need/rem)} (biên ${fpct(need/rem/avg,1)}) để cả năm đạt 8%.`;}
 out.push(t);const st=D.settle&&D.settle[String(m)];if(st)out.push(`Còn <b>${VD(st.ds_cho)} doanh số chờ sàn quyết toán</b>, phí tạm tính ${VD(st.phi_tt)} → khoảng ${VD(st.ds_cho-st.phi_tt)} chưa về tài khoản.`);
 return out;}
function pOverview(){
 const m=S.m,p=m-1,A=M.ch.all,mo=M.months;
 const K=(lab,val,txt,pv,opt={})=>{let d=opt.sub||"&nbsp;";if(p>=0&&pv!=null&&isFinite(pv)&&opt.cmp!==false){if(opt.rate){const dd=val-pv;d=`<span class="${cls(dd,opt.good)}">${dd>=0?"▲":"▼"} ${fn2(Math.abs(dd)*100)} điểm</span> so ${mo[p]}`;}else{const dd=pv?val/pv-1:0;d=`<span class="${cls(dd,opt.good)}">${dd>=0?"▲":"▼"} ${fn1(Math.abs(dd)*100)}%</span> so ${mo[p]}`;}}
  return`<div class="kpi"><div class="k">${lab}</div><div class="v">${txt}</div><div class="d">${d}</div></div>`;};
 const r=(k,i)=>A[k][i]/A.nmv[i],P=p>=0?p:0,yN=ytd(A.nmv,m),yK=ytd(A.kq,m);
 let h=`<div class="kpis">`+K("Doanh số sau hoàn",A.nmv[m],VD(A.nmv[m]),A.nmv[P])+K("Đơn thành công",A.orders[m],fn0(A.orders[m]),A.orders[P])+
  K("Giá trị đơn bình quân",A.nmv[m]/A.orders[m],fn0(A.nmv[m]/A.orders[m]*1e6)+" đ",A.nmv[P]/A.orders[P])+K("Phí sàn / doanh số",r("phisan",m),fpct(r("phisan",m),1),r("phisan",P),{rate:1,good:"down"})+
  K("ADS / doanh số",r("ads",m),fpct(r("ads",m),1),r("ads",P),{rate:1,good:"down"})+K("Lợi nhuận gộp / doanh số",r("lng",m),fpct(r("lng",m),1),r("lng",P),{rate:1})+
  K("KQKD trước thuế",A.kq[m],VD(A.kq[m]),A.kq[P])+K("Biên KQKD (mục tiêu 8%)",r("kq",m),fpct(r("kq",m),1),r("kq",P),{rate:1})+K("Lợi nhuận ròng",A.lnr[m],VD(A.lnr[m]),A.lnr[P])+
  K(`Lũy kế ${mo[0]}–${mo[m]}`,0,VD(yK),"",{cmp:false,sub:`biên ${fpct(yK/yN,2)} · ${yK/yN>=TARGET?'<span class="up">đạt 8%</span>':'<span class="dn">thiếu '+VD(TARGET*yN-yK)+"</span>"}`})+`</div>`;
 const c1=combo({labels:mo,stacked:true,money:true,bo:.45,h:330,yFmt:D0,bars:[{name:"Shopee",color:"var(--sp)",values:M.ch.sp.nmv.map(x=>x*1e6),tip:DD},{name:"TikTok",color:"var(--tt2)",values:M.ch.tt.nmv.map(x=>x*1e6),tip:DD},{name:"Ngoại sàn",color:"var(--ns)",values:M.ch.ns.nmv.map(x=>x*1e6),tip:DD}],
  lines:[{name:"Phí sàn / DS",color:"var(--sp)",right:true,values:A.nmv.map((x,i)=>x?A.phisan[i]/x*100:null),fmt:x=>fn1(x)+"%"},{name:"ADS / DS",color:"var(--violet)",right:true,values:A.nmv.map((x,i)=>x?A.ads[i]/x*100:null),fmt:x=>fn1(x)+"%"},{name:"Biên KQKD",color:"var(--blue)",right:true,labels:"all",values:A.nmv.map((x,i)=>x?A.kq[i]/x*100:null),fmt:x=>fn1(x)+"%"},{name:"Mục tiêu 8%",color:"var(--good)",right:true,dash:1,values:A.nmv.map(()=>8)}],rFmt:x=>fn0(x)+"%",rZero:true});
 const rows=["all","sp","tt","ns"].map(c=>hundred(c,m)).filter(Boolean);
 h+=`<div class="card">${cbox(`Doanh số theo kênh và tỷ lệ chi phí, ${mo[0]}–${mo[M.n-1]}`,"Cột: doanh số sau hoàn (đồng). Đường: % trên doanh số (trục phải). Di chuột/chạm vào cột để xem số.",c1,legend([{n:"Shopee",c:"var(--sp)"},{n:"TikTok",c:"var(--tt2)"},{n:"Ngoại sàn",c:"var(--ns)"},{n:"Phí sàn %",c:"var(--sp)",line:1},{n:"ADS %",c:"var(--violet)",line:1},{n:"Biên KQKD %",c:"var(--blue)",line:1},{n:"Mục tiêu 8%",c:"var(--good)",line:1,dash:1}]))}</div>`;
 h+=`<div class="cols"><div class="card">${rows.length?cbox(`Mỗi 100đ doanh số ${mo[m]} đi đâu`,"Giá vốn, chi phí chung phân bổ theo tỷ trọng doanh số; lương kho phân bổ theo số đơn.",hstack(rows),legend(rows[0].parts.map(p=>({n:p.n,c:p.c})))):""}</div>`;
 h+=`<div class="card"><h3 style="margin-top:4px">Nhận xét ${mo[m]}/${D.year}</h3><ul class="ins">${A.nmv[m]?insights(m).map(x=>`<li>${x}</li>`).join(""):"<li>Chưa có số liệu tháng này.</li>"}</ul></div></div>`;
 $("#p_ov").innerHTML=h;}

/* ===================== 2. DÒNG CHẢY KINH DOANH ===================== */
function plSteps(c,i){const C=M.ch[c],z=x=>x*1e6;return[
 {l:"Doanh số sau hoàn",v:z(C.nmv[i]),t:"start"},{l:"Giá vốn",v:-z(C.gv[i]),t:"d"},{l:"Định phí sàn",v:-z(C.dinh[i]-C.vatcty[i]),t:"d"},...(Math.abs(C.vatcty[i])>0.05?[{l:"Thuế GTGT công ty",v:-z(C.vatcty[i]),t:"d"}]:[]),
 {l:"Biến phí sàn",v:-z(C.bien[i]),t:"d"},{l:"Lợi nhuận gộp",t:"sub",c:"var(--tt)"},{l:"ADS",v:-z(C.ads[i]),t:"d"},{l:"CP bán hàng khác",v:-z(C.bhk[i]),t:"d"},{l:"Lãi đóng góp",t:"sub",c:"var(--teal)"},
 {l:"Vận hành biến động",v:-z(C.vhbd[i]),t:"d"},{l:"Lương kho vận đơn",v:-z(C.kho[i]),t:"d"},{l:"Vận hành cố định khác",v:-z(C.vhcd_o[i]),t:"d"},{l:"Thu nhập − chi phí khác",v:z(C.tnk[i]-C.cpk[i]),t:"d"},{l:"KẾT QUẢ KINH DOANH",t:"sub"}];}
function pFlow(){
 const m=S.m,c=S.ch,C=M.ch[c],A=M.ch.all,mo=M.months,N=C.nmv[m];if(!N){$("#p_flow").innerHTML=`<div class="card">Chưa có số liệu ${CHN[c]} ${mo[m]}.</div>`;return;}
 const pc=v=>fpct(v/N,1),z=x=>x*1e6;
 const costs=[{id:"gv",label:"Giá vốn",v:C.gv[m],c:"var(--gray)"},{id:"ps",label:"Phí sàn",v:C.phisan_net[m],c:"var(--sp)"},{id:"vat",label:"Thuế GTGT công ty",v:C.vatcty[m],c:"var(--amber)"},{id:"ads",label:"ADS",v:C.ads[m],c:"var(--violet)"},{id:"bhk",label:"CP bán hàng khác",v:C.bhk[m],c:"var(--teal)"},{id:"opx",label:"Vận hành, lương, kho",v:C.opx[m],c:"var(--tt2)"}].filter(x=>x.v>0.05).map(x=>({...x,v:z(x.v)}));
 const kq=z(C.kq[m]);costs.forEach(x=>x.sub=D0(x.v)+" · "+pc(x.v/1e6));
 const right=[...costs];if(kq>0)right.push({id:"kq",label:"KQKD",v:kq,c:"var(--blue)",sub:D0(kq)+" · "+pc(kq/1e6)});
 const nmvNode={id:"nmv",label:"Doanh số sau hoàn",v:z(N),c:"var(--tt)",sub:D0(z(N))},loss=kq<0?{id:"loss",label:"Lỗ",v:-kq,c:"var(--bad)",sub:D0(kq)}:null;
 const sfill=(srcs,tgts)=>{const L=[];let si=0,rem=srcs[0]?srcs[0].v:0;tgts.forEach(t=>{let need=t.v;while(need>1e-6&&si<srcs.length){const take=Math.min(need,rem);if(take>0)L.push({s:srcs[si].id,t:t.id,v:take});need-=take;rem-=take;if(rem<=1e-6){si++;rem=srcs[si]?srcs[si].v:0;}}});return L;};
 let cols,links;
 if(c==="all"&&A.gmv[m]>0){const gmv=z(A.gmv[m]),huy=z(A.ds_huy[m]),hoan=z(A.ds_hoan[m]),diff=gmv-huy-hoan-z(N);
  const mid=[nmvNode];if(loss)mid.push(loss);mid.push({id:"hoan",label:"Hoàn",v:hoan,c:"var(--warn)",sub:D0(hoan)+" · "+fpct(hoan/gmv,1)+" GMV"},{id:"huy",label:"Hủy",v:huy,c:"var(--bad)",sub:D0(huy)+" · "+fpct(huy/gmv,1)+" GMV"});
  if(diff>gmv*0.002)mid.push({id:"dif",label:"Chênh lệch chưa giải thích",v:diff,c:"var(--mut)",sub:D0(diff)});
  const gv0=Math.max(gmv,z(N)+huy+hoan);cols=[[{id:"gmv",label:"Doanh số đặt đơn",v:gv0,c:"var(--ink)",sub:D0(gmv)+(diff<-gmv*0.002?" (phễu không cộng khớp)":"")}],mid,right];
  links=[...sfill([{id:"gmv",v:gv0}],mid.filter(x=>x.id!=="loss")),...sfill([nmvNode,...(loss?[loss]:[])],right)];}
 else{cols=[[nmvNode,...(loss?[loss]:[])],right];links=sfill([nmvNode,...(loss?[loss]:[])],right);}
 let h=`<div class="card">${cbox(`Dòng chảy doanh số ${CHN[c]} ${mo[m]}/${D.year}`,`Từ doanh số đặt đơn đến kết quả kinh doanh (đồng · % doanh số sau hoàn).${c!=="all"?" Theo kênh bắt đầu từ doanh số sau hoàn.":""}`,sankey(cols,links,{h:c==="all"?410:340}))}</div>`;
 h+=`<div class="card">${cbox(`Từ doanh số đến KQKD – ${CHN[c]} ${mo[m]}`,"Xanh lá: cộng vào; cam: trừ đi; xanh dương/đậm: số tổng.",waterfall(plSteps(c,m)))}</div>`;
 const tr=combo({labels:mo,money:true,bo:.6,yFmt:D0,bars:[{name:"Doanh số",color:c==="sp"?"var(--sp2)":c==="ns"?"var(--ns)":"var(--tt2)",values:C.nmv.map(x=>x*1e6),tip:DD}],
  lines:[{name:"Phí sàn chưa ADS",color:"var(--sp)",right:true,labels:"last",values:C.nmv.map((x,i)=>x?C.phisan[i]/x*100:null),fmt:x=>fn1(x)+"%"},{name:"Phí sàn + ADS",color:"var(--tt)",right:true,labels:"last",values:C.nmv.map((x,i)=>x?(C.phisan[i]+C.ads[i])/x*100:null),fmt:x=>fn1(x)+"%"},{name:"Biên KQKD",color:"var(--blue)",right:true,labels:"all",values:C.nmv.map((x,i)=>x?C.kq[i]/x*100:null),fmt:x=>fn1(x)+"%"}],rFmt:x=>fn0(x)+"%",rZero:true});
 const ao=combo({labels:mo,yFmt:fn0,ml:70,bars:[{name:"Đơn thành công",color:"var(--tt2)",values:C.orders,tip:fn0}],lines:[{name:"Giá trị đơn BQ (đ)",color:"var(--sp)",right:true,labels:"all",values:C.nmv.map((x,i)=>C.orders[i]?x/C.orders[i]*1e6:null),fmt:fn0}],rFmt:fn0});
 h+=`<div class="cols"><div class="card">${cbox(`${CHN[c]}: doanh số và tỷ lệ phí`,"Cột: doanh số (đồng). Đường: % trên doanh số.",tr,legend([{n:"Doanh số",c:"var(--tt2)"},{n:"Phí sàn chưa ADS",c:"var(--sp)",line:1},{n:"Phí sàn + ADS",c:"var(--tt)",line:1},{n:"Biên KQKD",c:"var(--blue)",line:1}]))}</div>
  <div class="card">${cbox(`${CHN[c]}: số đơn và giá trị đơn bình quân`,"Cột: đơn thành công. Đường: đồng/đơn.",ao,legend([{n:"Đơn thành công",c:"var(--tt2)"},{n:"Giá trị đơn BQ",c:"var(--sp)",line:1}]))}</div></div>`;
 if(c==="all"){const T=A;h+=`<div class="card"><h2>Phễu đơn hàng và doanh số</h2><div class="note">Tỷ lệ tính trên doanh số đặt đơn (GMV). Dòng "Kiểm tra phễu" = GMV − hủy − hoàn − doanh số sau hoàn; khác 0 nghĩa là các bước không cộng khớp.</div>`+seriesTable({title:"Phễu đơn hàng",labels:mo,ytd:true,hl:m,rows:[
  {l:"Số đơn đặt",f:i=>T.don_dat[i],kind:"cnt"},{l:"Số đơn hoàn/hủy",f:i=>T.don_hh[i],kind:"cnt"},{l:"Tỷ lệ hoàn/hủy theo đơn",num:i=>T.don_hh[i],den:i=>T.don_dat[i],chg:true,thr:.02},{l:"Số đơn thành công",f:i=>T.orders[i],kind:"cnt",cls:"sec"},
  {l:"Doanh số đặt đơn (GMV)",f:i=>T.gmv[i]},{l:"Tỷ lệ hủy / GMV",num:i=>T.ds_huy[i],den:i=>T.gmv[i],chg:true,thr:.02},{l:"Tỷ lệ hoàn / GMV",num:i=>T.ds_hoan[i],den:i=>T.gmv[i]},
  {l:"Doanh số sau hoàn hủy (NMV)",f:i=>T.nmv[i],cls:"sec"},{l:"NMV / GMV",num:i=>T.nmv[i],den:i=>T.gmv[i],good:"up"},{l:"Giá trị đơn bình quân (đ)",num:i=>T.nmv[i]*1e6,den:i=>T.orders[i],kind:"dong"},
  {l:"Kiểm tra phễu",f:i=>T.gmv[i]-T.ds_huy[i]-T.ds_hoan[i]-T.nmv[i]}]})+`</div>`;}
 $("#p_flow").innerHTML=h;}

/* ===================== 3. DÒNG TIỀN ===================== */
function cashSteps(c,i){const C=M.ch[c],A=M.ch.all,z=x=>x*1e6,st=[
 {l:"Khách trả (doanh số sau hoàn)",v:z(C.nmv[i]),t:"start"},{l:"Sàn cấn trừ phí",v:-z(C.phisan_net[i]),t:"d"},{l:"Tiền sàn trả về",t:"sub",c:"var(--tt)"},...(Math.abs(C.vatcty[i])>0.05?[{l:"Nộp thuế GTGT công ty",v:-z(C.vatcty[i]),t:"d"}]:[]),
 {l:"Nạp ADS",v:-z(C.ads[i]),t:"d"},{l:"Tiền hàng (giá vốn)",v:-z(C.gv[i]),t:"d"},{l:"CP bán hàng khác",v:-z(C.bhk[i]),t:"d"},{l:"Lương, vận hành, kho",v:-z(C.vhbd[i]+C.kho[i]+C.vhcd_o[i]+C.cpk[i]),t:"d"},{l:"Thu nhập khác",v:z(C.tnk[i]),t:"d"},{l:"Dòng tiền kinh doanh",t:"sub"}];
 if(c==="all")st.push({l:"Thuế TNDN/TNCN",v:-z(A.tndn[i]),t:"d"},{l:"Dòng tiền thuần",t:"sub",c:"var(--good)"});return st;}
function pCash(){
 const m=S.m,c=S.ch,C=M.ch[c],A=M.ch.all,mo=M.months,n=M.n,pay=i=>C.nmv[i]-C.phisan_net[i];

function bridge(c,m){const C=M.ch[c],p=m-1,N0=C.nmv[p],N1=C.nmv[m],Q0=C.orders[p],Q1=C.orders[m],r=(k,i)=>C.nmv[i]?C[k][i]/C.nmv[i]:0,ks=[["gv","Giá vốn %"],["phisan","Phí sàn %"],["ads","ADS %"],["bhk","CP bán hàng khác %"]];
 const v0=sum(ks.map(k=>r(k[0],p))),F=i=>C.vhbd[i]+C.kho[i]+C.vhcd_o[i]+C.cpk[i];let eV,eA;
 if(Q0>0&&Q1>0){const A0=N0/Q0,A1=N1/Q1;eV=(Q1-Q0)*A0*(1-v0);eA=Q1*(A1-A0)*(1-v0);}else{eV=(N1-N0)*(1-v0);eA=0;}
 const it=[{l:"Số đơn",v:eV,d:Q1-Q0},{l:"Giá trị đơn BQ",v:eA,d:(Q1&&Q0)?(N1/Q1-N0/Q0)*1e6:null},...ks.map(([k,l])=>({l,v:-N1*(r(k,m)-r(k,p)),d:r(k,m)-r(k,p),k})),{l:"Chi phí vận hành",v:-(F(m)-F(p)),d:F(m)-F(p)},{l:"Thu nhập khác",v:C.tnk[m]-C.tnk[p],d:C.tnk[m]-C.tnk[p]}];
 return{kq0:C.kq[p],kq1:C.kq[m],it,v0};}

  msg.innerHTML=`<span class="up">Đã đổi mã.</span> File mới <b>BaoCao_TMDT_bao_mat_${today()}.html</b> (khóa bằng mã mới) vừa tải về thư mục <b>Downloads</b>. Nếu không thấy file tải về, hãy làm lại bước này trên Chrome hoặc Edge. Sau đó báo Claude để đưa file lên GitHub.`;}
 catch(err){msg.innerHTML=`<span class="dn">Không đổi được mã: ${esc(err.message||err)}</span>`;}
 $("#pwGo").disabled=false;}
function lockNow(){try{saveLocal();}catch(e){}location.reload();}
let idleT=null;function idle(){clearTimeout(idleT);idleT=setTimeout(lockNow,20*60*1000);}
async function boot(){
 const raw=$("#payload").textContent.trim(),form=$("#lockForm"),msg=$("#lockMsg");let fails=0;
 if(!raw||raw.startsWith("__")){msg.textContent="File chưa có dữ liệu: đặt mã bảo mật mới để bắt đầu, sau đó nhập file Excel ở trang Dữ liệu.";$("#lockPw").placeholder="Đặt mã bảo mật mới (≥ 8 ký tự)";}
 form.onsubmit=async e=>{e.preventDefault();const pw=$("#lockPw").value;if(!pw)return;msg.textContent="Đang giải mã…";await new Promise(r=>setTimeout(r,30));
  try{if(!raw||raw.startsWith("__")){if(pw.length<8)throw new Error("SHORT");SESSION=await Sec.derive(pw,Sec.rand(16),ITER);D=normalize(emptyData());S.tab="data";}
   else{const p=Sec.parse(raw);let keys=await Sec.derive(pw,p.salt,p.iter),txt=null;
    try{txt=Sec.openWith(p,keys);}catch(e1){const raw2=($("#payload2")||{}).textContent;const r2=raw2?raw2.trim():"";if(!r2||r2.startsWith("__"))throw e1;
     const q=Sec.parse(r2);keys=await Sec.derive(pw,q.salt,q.iter);txt=Sec.openWith(q,keys);ROLE="viewer";}
    D=normalize(JSON.parse(txt));SESSION=keys;if(D.role==="viewer")ROLE="viewer";}
   STORE_KEY="tmdt_sec_"+D.id+(ROLE==="viewer"?"_v":"");
   try{const st=localStorage.getItem(STORE_KEY);if(st){const q=Sec.parse(st),k2=Sec.same(q.salt,SESSION.salt)&&q.iter===SESSION.iter?SESSION:await Sec.derive(pw,q.salt,q.iter),d2=normalize(JSON.parse(Sec.openWith(q,k2)));if(valid(d2))D=d2;}}catch(_){}
   $("#lockPw").value="";document.body.classList.remove("locked");initUI();M=buildModel(D);S.m=M.n-1;S.pasteM=M.n-1;renderAll();
   ["click","keydown","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,idle,{passive:true}));idle();}
  catch(err){fails++;msg.textContent=err.message==="SHORT"?"Mã phải có ít nhất 8 ký tự.":err.message==="FORMAT"?"Dữ liệu trong file bị hỏng.":"Mã bảo mật không đúng."+(fails>=3?" Vui lòng chờ…":"");
   if(fails>=3){form.querySelector("button").disabled=true;setTimeout(()=>{form.querySelector("button").disabled=false;},fails*2000);}}};
 $("#lockPw").focus();}
/* ===================== ỨNG DỤNG CÀI ĐẶT (PWA): mở offline, cài lên màn hình chính ===================== */
(function(){
 const web=location.protocol==="https:"&&!EMBED,isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 const btns=()=>["lockInstall","bInstall"].map(id=>document.getElementById(id)).filter(Boolean);let dp=null;
 if(web&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
 addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;btns().forEach(b=>b.hidden=false);});
 addEventListener("appinstalled",()=>{dp=null;btns().forEach(b=>b.hidden=true);});
 btns().forEach(b=>b.onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice;}catch(_){}dp=null;btns().forEach(x=>x.hidden=true);});
 const h=document.getElementById("instHint");
 if(h&&web&&!standalone){h.textContent=isIOS?"iPhone/iPad: mở bằng Safari, bấm nút Chia sẻ → “Thêm vào MH chính” để cài thành ứng dụng (mở được khi mất mạng).":"Có thể cài thành ứng dụng: bấm nút “Cài” khi hiện ra, hoặc menu trình duyệt → “Cài đặt ứng dụng / Thêm vào màn hình chính”.";}
 const ns=document.getElementById("netState"),upd=()=>{if(ns)ns.textContent=navigator.onLine?"":"Đang không có mạng – dùng bản đã lưu trên máy.";};addEventListener("online",upd);addEventListener("offline",upd);upd();
})();
boot();
</script>
